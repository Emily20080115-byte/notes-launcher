<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>筆記</title>
<meta name="apple-mobile-web-app-title" content="筆記">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:#f6f4ee;color:#3b3325;text-align:center}
img{width:120px;height:120px;border-radius:26px;box-shadow:0 6px 20px rgba(0,0,0,.12)}
a{display:inline-block;margin-top:18px;padding:12px 28px;border-radius:999px;background:#2547d0;color:#fff;text-decoration:none;font-weight:600}
p{color:#7a705e;font-size:14px;max-width:22em;margin:14px auto 0;line-height:1.6}
</style>
</head>
<body>
<main>
  <img src="icon-180.png" alt="">
  <h1 style="margin:16px 0 0;font-size:24px">筆記</h1>
  <a id="go" href="https://claude.ai/artifact/QwB4FjGWyoNt75iWGT66H4">打開筆記</a>
  <p id="tip">正在打開…<br>想把這個圖示放到桌面：用 Safari 打開這頁，按分享 →「加入主畫面」。</p>
</main>
<script>
// Opened from the home screen: go straight to the notebook. Visiting in a normal tab: stay, so the page can be added to the home screen.
var standalone = window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
var fromIcon = standalone || /[?&]go=1/.test(location.search);
if (fromIcon) location.replace(document.getElementById('go').href);
else document.getElementById('tip').innerHTML = '想把這個圖示放到桌面：用 Safari 打開這頁，按分享 →「加入主畫面」。<br>之後點桌面的圖示就會直接打開筆記。';
</script>
</body>
</html>
