<!doctype html><html lang="zh-Hant"><head><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="筆記離線"><meta name="theme-color" content="#ffffff"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.json"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>筆記</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: study-desk app — slim header, sticky tab rail, each tool in one working column (two on wide screens). Highlighter-pen marks key words. */
:root{
  --paper:#f4f6fa; --surface:#ffffff; --surface-2:#eef1f7; --ink:#18202e; --muted:#5a6578; --line:#dbe1ea;
  --accent:#2547d0; --accent-ink:#ffffff; --accent-soft:#e5eaff;
  --mark:#ffe14d; --mark-ink:#18202e;
  --good:#1d8456; --good-soft:#e2f4ea; --warn:#9a6200; --warn-soft:#fbf0d9; --bad:#c42f3a; --bad-soft:#fbe4e6;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 8px 24px rgba(20,30,60,.08);
  --f-ui:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-word:"Literata",Georgia,"Times New Roman",serif;
  --r:10px;
  --tg-gray-bg:#eceef2; --tg-gray-ink:#4a5263; --tg-yellow-bg:#fff0b0; --tg-yellow-ink:#6e5200;
  --tg-blue-bg:#e3eaff; --tg-blue-ink:#2a45b8; --tg-green-bg:#dcf3e6; --tg-green-ink:#1b6e47; --tg-pink-bg:#fde3ee; --tg-pink-ink:#a3285e;
  --tg-orange-bg:#ffe4cc; --tg-orange-ink:#9a4a00; --tg-red-bg:#fde0de; --tg-red-ink:#b42318; --tg-purple-bg:#ece4ff; --tg-purple-ink:#5b34b0;
  --tg-teal-bg:#d6f3f1; --tg-teal-ink:#0f6b66; --tg-brown-bg:#efe5dc; --tg-brown-ink:#6b4a2f;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f131b; --surface:#161b25; --surface-2:#1d2330; --ink:#e6eaf2; --muted:#9aa4b6; --line:#2a3242;
  --accent:#8fa3ff; --accent-ink:#0f131b; --accent-soft:#232c4f; --mark:rgba(255,213,0,.34); --mark-ink:#fff6cc;
  --good:#4cc08a; --good-soft:#163326; --warn:#e2a83f; --warn-soft:#33270f; --bad:#f07780; --bad-soft:#3a1a1e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
  --tg-gray-bg:#2a303b; --tg-gray-ink:#c3cad6; --tg-yellow-bg:#3d3310; --tg-yellow-ink:#f3d36b;
  --tg-blue-bg:#222c50; --tg-blue-ink:#a9b8ff; --tg-green-bg:#163326; --tg-green-ink:#7fd8a8; --tg-pink-bg:#3d1a2a; --tg-pink-ink:#f29abd;
  --tg-orange-bg:#3d2410; --tg-orange-ink:#f7b27a; --tg-red-bg:#3d1715; --tg-red-ink:#f59a92; --tg-purple-bg:#2b2147; --tg-purple-ink:#c3adff;
  --tg-teal-bg:#0f3331; --tg-teal-ink:#6fd6cf; --tg-brown-bg:#33281f; --tg-brown-ink:#d9b896;
}}
:root[data-theme="dark"]{
  --paper:#0f131b; --surface:#161b25; --surface-2:#1d2330; --ink:#e6eaf2; --muted:#9aa4b6; --line:#2a3242;
  --accent:#8fa3ff; --accent-ink:#0f131b; --accent-soft:#232c4f; --mark:rgba(255,213,0,.34); --mark-ink:#fff6cc;
  --good:#4cc08a; --good-soft:#163326; --warn:#e2a83f; --warn-soft:#33270f; --bad:#f07780; --bad-soft:#3a1a1e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
  --tg-gray-bg:#2a303b; --tg-gray-ink:#c3cad6; --tg-yellow-bg:#3d3310; --tg-yellow-ink:#f3d36b;
  --tg-blue-bg:#222c50; --tg-blue-ink:#a9b8ff; --tg-green-bg:#163326; --tg-green-ink:#7fd8a8; --tg-pink-bg:#3d1a2a; --tg-pink-ink:#f29abd;
  --tg-orange-bg:#3d2410; --tg-orange-ink:#f7b27a; --tg-red-bg:#3d1715; --tg-red-ink:#f59a92; --tg-purple-bg:#2b2147; --tg-purple-ink:#c3adff;
  --tg-teal-bg:#0f3331; --tg-teal-ink:#6fd6cf; --tg-brown-bg:#33281f; --tg-brown-ink:#d9b896;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{font-family:var(--f-word);font-weight:700;font-size:20px;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);flex:none}
.brand-img{object-fit:cover;background:#fff;box-shadow:0 0 0 1px var(--line)}
.brand h1{font-size:18px;font-weight:700}
.brand p{margin:0;color:var(--muted);font-size:13px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:4px 10px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok::before{background:var(--good)} .sync.local::before{background:var(--warn)} .sync.err::before{background:var(--bad)}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs-in{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;padding:12px 14px;font-weight:500;color:var(--muted);border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .n{font-size:11.5px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:0 7px;font-weight:700}

main{padding-block:22px 120px}
.view-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.view-head h2{font-size:22px}
.view-head p{margin:2px 0 0;color:var(--muted);max-width:60ch}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h3{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.3}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.good{background:var(--good);border-color:var(--good);color:var(--accent-ink)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}

input[type=text],input[type=search],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.7}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}

.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{appearance:none;border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.speak{appearance:none;border:1px solid var(--line);background:var(--surface);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;color:var(--accent);flex:none}
.speak:hover{background:var(--accent-soft)}
.speak svg{width:16px;height:16px}
.speak.big{width:44px;height:44px} .speak.big svg{width:20px;height:20px}
.word{font-family:var(--f-word);font-weight:700;appearance:none;border:0;background:none;padding:0;cursor:pointer;color:var(--ink);text-align:left}
.word:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.pos{font-family:var(--f-word);font-style:italic;color:var(--muted);font-size:13px;font-weight:500;margin-left:6px}

/* reader */
.reader{font-family:var(--f-word);font-size:18px;line-height:1.95;max-width:68ch}
.tok{cursor:pointer;border-radius:3px;padding:0 1px}
.tok:hover{background:var(--accent-soft)}
.tok.key{background:linear-gradient(transparent 52%,var(--mark) 52%);color:var(--ink)}
.tok.mine{text-decoration:underline 2px var(--accent);text-underline-offset:4px}
.tok.sel{background:var(--accent);color:var(--accent-ink)}
.tok.reading,.snt.reading{background-color:var(--accent-soft)}
.snt.reading{border-radius:3px}
.readbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.readbar .seg button{padding:4px 9px;font-size:13px;font-variant-numeric:tabular-nums}
.btn svg{width:16px;height:16px;flex:none}
/* photo notes */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;border:2px dashed var(--line);border-radius:var(--r);padding:22px 16px;cursor:pointer;color:var(--muted);background:var(--surface-2)}
.drop:hover,.drop:focus-within{border-color:var(--accent);color:var(--accent)}
.drop strong{color:var(--ink);font-size:15px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.thumb{position:relative;margin:0}
.thumb img,.nphoto{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;background:var(--surface-2)}
.thumb button{position:absolute;top:4px;right:4px;padding:2px 8px;font-size:12px}
.pdfcap{position:absolute;left:0;right:0;bottom:0;background:rgba(20,28,45,.82);color:#fff;font-size:11.5px;font-weight:700;padding:4px 6px;border-radius:0 0 8px 8px;line-height:1.35}
.pdfcap span{display:block;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nphotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.res h4{font-size:14px;margin:14px 0 6px;color:var(--muted);font-weight:700}
.res ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.res .formula{font-family:ui-monospace,Consolas,monospace;font-size:14px;background:var(--surface-2);border-radius:6px;padding:4px 8px;overflow-x:auto;white-space:pre-wrap}
.res .term{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.res .term:first-child{border-top:0}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.pgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:480px){.res .term{grid-template-columns:minmax(0,1fr);gap:2px}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:12px}
.legend i{font-style:normal;font-family:var(--f-word)}
.legend .lk{background:linear-gradient(transparent 52%,var(--mark) 52%);padding:0 3px}
.legend .lm{text-decoration:underline 2px var(--accent);text-underline-offset:3px}

.klist{display:flex;flex-direction:column}
.kitem{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.kitem:first-child{border-top:0}
.kitem .z{font-size:13.5px;color:var(--muted)}
.done-tag{font-size:12px;color:var(--good);font-weight:700;white-space:nowrap}

/* word rows */
.wlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.wrow{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wgroup{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px 8px;background:var(--surface-2);border-top:1px solid var(--line)}
.wgroup:first-child{border-top:0;border-radius:var(--r) var(--r) 0 0}
.wgroup .btn.sm{padding:2px 8px}
.chsel{width:auto!important;max-width:11em;padding:3px 6px!important;font-size:12.5px}
.wrow .wf{font-size:17px}
.wrow .wb{color:var(--ink)}
.wrow .ex{font-size:13px;color:var(--muted);font-family:var(--f-word);font-style:italic}
.wrow .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.wrow .noplay{width:32px}
@media (max-width:560px){.wrow{grid-template-columns:32px minmax(0,1fr)}.wrow .meta{grid-column:2;justify-content:flex-start}}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);white-space:nowrap}
.tag{font-size:12px;border-radius:6px;padding:1px 8px;white-space:nowrap;font-weight:500;border:1px solid transparent;display:inline-block}
.tag-gray{background:var(--tg-gray-bg);color:var(--tg-gray-ink)}
.tag-yellow{background:var(--tg-yellow-bg);color:var(--tg-yellow-ink)}
.tag-blue{background:var(--tg-blue-bg);color:var(--tg-blue-ink)}
.tag-green{background:var(--tg-green-bg);color:var(--tg-green-ink)}
.tag-pink{background:var(--tg-pink-bg);color:var(--tg-pink-ink)}
.tag-orange{background:var(--tg-orange-bg);color:var(--tg-orange-ink)}
.tag-red{background:var(--tg-red-bg);color:var(--tg-red-ink)}
.tag-purple{background:var(--tg-purple-bg);color:var(--tg-purple-ink)}
.tag-teal{background:var(--tg-teal-bg);color:var(--tg-teal-ink)}
.tag-brown{background:var(--tg-brown-bg);color:var(--tg-brown-ink)}
.tag-none{border-color:var(--line);color:var(--muted)}
.subj-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;align-items:start}
.subj-col{transition:outline-color .1s;outline:2px dashed transparent;outline-offset:-2px}
.subj-col.drop-col{outline-color:var(--accent)}
.srows{display:flex;flex-direction:column;min-height:40px}
.srow{display:flex;flex-direction:column;gap:6px;padding:10px 4px;border-top:1px solid var(--line);border-radius:6px}
.srow:first-child{border-top-color:transparent}
.srow[draggable="true"]{cursor:grab}
.srow.dragging{opacity:.4}
.srow.drop-before{box-shadow:inset 0 3px 0 var(--accent)}
.srow.drop-after{box-shadow:inset 0 -3px 0 var(--accent)}
.srow .s1{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.srow .s2{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.srow .handle{color:var(--muted);font-size:14px;letter-spacing:-2px;user-select:none}
.srow .cnt{font-size:12px;color:var(--muted)}
.srow select{width:auto;padding:3px 6px;font-size:13px}
.srow .mv{width:30px;padding:3px 0;justify-content:center}
.cgap{height:6px}
.art{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.art:hover{border-color:var(--accent)}
.art[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.art .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.savebar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.savebar input{flex:2 1 200px;width:auto}
.savebar select{flex:1 1 140px;width:auto}
.savebar #rdChap{flex:1 1 140px}
.savebar #rdSec{flex:1 1 100px}
.psep{color:var(--muted);margin:0 6px;font-weight:400}
.rgroup summary{cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 2px;list-style:none}
.rgroup summary::-webkit-details-marker{display:none}
.rgroup summary::before{content:"▸";color:var(--muted);font-size:12px}
.rgroup[open] summary::before{content:"▾"}
.rgroup > .stack{padding:0 0 8px}
.art .t{font-family:var(--f-word);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:12px;border-radius:999px;padding:2px 9px;font-weight:700;white-space:nowrap}
.st-new{background:var(--surface-2);color:var(--muted)}
.st-learn{background:var(--warn-soft);color:var(--warn)}
.st-master{background:var(--good-soft);color:var(--good)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
details.add{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px}
details.add summary{cursor:pointer;padding:12px 16px;font-weight:700;color:var(--accent)}
details.add .in{padding:0 16px 16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar > *{flex:1 1 150px;width:auto}
.toolbar input[type=search]{flex:2 1 220px}

/* flashcard */
.fc-wrap{max-width:560px;margin:0 auto}
.fc{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-height:280px;padding:28px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;cursor:pointer;position:relative}
.fc .front{font-size:clamp(28px,7vw,40px);font-weight:700;overflow-wrap:anywhere}
.fc .front.en{font-family:var(--f-word)}
.fc .back{font-size:20px;font-weight:500}
.fc .hint{position:absolute;bottom:12px;font-size:12px;color:var(--muted)}
.fc .tagline{position:absolute;top:12px;left:14px;font-size:12px;color:var(--muted)}
.fc-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fc-actions .btn{justify-content:center;padding:12px}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:12px}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.kbd{font-size:11.5px;color:var(--muted);text-align:center;margin-top:10px}

/* quiz */
.q-prompt{font-size:clamp(24px,6vw,34px);font-weight:700;text-align:center;padding:18px 0;overflow-wrap:anywhere}
.q-prompt.en{font-family:var(--f-word)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.choices{grid-template-columns:1fr}}
.choice{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;min-width:0}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice .k{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:5px;width:22px;height:22px;display:grid;place-items:center;flex:none}
.choice.en{font-family:var(--f-word);font-weight:700}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice:disabled{cursor:default}
.score{font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}

/* progress */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
@media (max-width:700px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.hbar{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13.5px;padding:4px 0}
.hbar .t{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;display:flex}
.hbar .t i{display:block;height:100%}
.hbar .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
table.hist{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.hist td,table.hist th{padding:6px 4px;border-top:1px solid var(--line);text-align:left}
table.hist th{color:var(--muted);font-weight:500;border-top:0}

/* notes */
.notes{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}

.pvbar{justify-content:space-between;gap:6px}
.pdfpane{height:calc(100vh - 200px);min-height:320px;overflow:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px;-webkit-overflow-scrolling:touch}
.pv-pages{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:min-content}

.inkbar{justify-content:flex-start;gap:6px}

.nlist{display:flex;flex-direction:column;gap:6px}

.chap{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}

.chap-t{font-weight:700;flex:1 1 auto;min-width:0}

.nview{min-height:200px;line-height:1.75;overflow-wrap:anywhere}
.nview .np{margin:0}

.nview .nli::before{content:"•";position:absolute;left:.2em;color:var(--muted)}
.nview .nterm{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr);gap:10px;padding:5px 0;border-top:1px solid var(--line)}
.nfig{margin:8px 0}
.nfig .nimg{margin:0 0 6px}
.img-tools,.tbl-tools{gap:6px;margin:4px 0 10px}

.ntable{border-collapse:collapse;min-width:100%;font-size:14px}

.ntable th{background:var(--surface-2);font-weight:700}
.ntable [contenteditable]:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.thumb .btn.sm{position:absolute;top:4px;right:4px;padding:2px 8px;font-size:12px}
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:2px;margin:0 0 14px;font-size:15px}
.crumb{appearance:none;border:0;background:none;padding:4px 6px;border-radius:6px;color:var(--accent);cursor:pointer;font-weight:500}
.crumb:hover{background:var(--accent-soft)}
.crumb.on{color:var(--ink);font-weight:700;cursor:default}
.fh{font-size:14px;color:var(--muted);margin:4px 0 8px}
.ftiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:10px}
.ftile{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0;border-left:4px solid var(--line)}
.ftile:hover{border-color:var(--accent)}

.ftile.fword{border-left-color:var(--accent)} .ftile.fnote{border-left-color:var(--good)} .ftile.fq{border-left-color:var(--warn)} .ftile.fnone{border-style:dashed}
.addf{margin-top:14px} .addf input{flex:1 1 200px;width:auto}
.qtext{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;margin-top:6px}

.nlink{color:var(--accent);text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
.linkform input{flex:1 1 160px;width:auto}
.chk{display:flex;gap:8px;align-items:flex-start;color:var(--muted);cursor:pointer}

.vocab{display:flex;flex-direction:column}
.vrow{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.vrow:first-child{border-top:0}
.genq{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface)}
.genq input{margin-top:5px}
.grade{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--surface-2)}
.askbox{border-top:1px solid var(--line);padding-top:10px}
.askbox summary{cursor:pointer;font-weight:700;color:var(--accent)}

.askbox .row{align-items:flex-end}

.askq{align-self:flex-end;max-width:85%;background:var(--accent-soft);border-radius:12px 12px 2px 12px;padding:8px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.aska{max-width:95%;background:var(--surface-2);border-radius:12px 12px 12px 2px;padding:8px 12px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}
.exam{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.cd{font-weight:700;color:var(--accent);white-space:nowrap} .cd.soon{color:var(--bad)}
.sres{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.sres:hover{border-color:var(--accent)} .sres .st{font-weight:700;overflow-wrap:anywhere} .sres .chip{align-self:flex-start}
mark{background:var(--mark);color:inherit;border-radius:2px}
.tile .btn{width:100%;justify-content:center}
.mcq{margin-top:10px;grid-template-columns:1fr}
.pdfchip{display:inline-flex;gap:2px;align-items:center}
.qfld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.qfld > .row:first-child{flex-wrap:wrap;row-gap:6px} .qfld .row > span.row{flex-wrap:wrap} .qfld .btn.sm{padding:2px 8px}
.qprev{color:var(--ink);font-weight:400;font-size:15px}
.qans{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--surface-2)}
.qimg{display:block;max-width:100%;max-height:360px;border-radius:8px;border:1px solid var(--line);margin-top:8px}
.nimg{display:block;max-width:100%;max-height:70vh;border-radius:8px;border:1px solid var(--line);margin:8px 0;background:var(--surface-2)}
.editor .title{font-size:18px;font-weight:700}
.tip{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 12px}
.tip code{font-family:ui-monospace,Consolas,monospace;background:var(--surface);padding:0 4px;border-radius:4px}

/* sheet & toast */
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;z-index:20}
.sheet-head{display:flex;gap:12px;align-items:center}
.sheet-head .hw{font-family:var(--f-word);font-size:24px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.sheet-head .x{margin-left:auto;align-self:flex-start}
.sheet .mean{font-size:16px;margin:10px 0 4px}
.sheet .ctx{font-family:var(--f-word);font-style:italic;color:var(--muted);font-size:14px;margin:6px 0 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:14px;font-size:14px;z-index:30;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}

  .fc{transition:transform .15s}
  .fc:active{transform:scale(.99)}
}

<script>
/* offline build: no claude.ai runtime. Files (photos / PDFs) live in IndexedDB; the service worker serves them at _blob/<id>. */
window.__offline=true;
(function(){
  var DB="notes-offline", ST="files";
  function idb(){ return new Promise(function(ok,no){ var r=indexedDB.open(DB,1); r.onupgradeneeded=function(){ r.result.createObjectStore(ST); }; r.onsuccess=function(){ ok(r.result); }; r.onerror=function(){ no(r.error); }; }); }
  function tx(mode, fn){ return idb().then(function(d){ return new Promise(function(ok,no){ var t=d.transaction(ST,mode), q=fn(t.objectStore(ST)); t.oncomplete=function(){ ok(q && q.result); }; t.onerror=function(){ no(t.error); }; }); }); }
  var files={ put:function(id,b){ return tx("readwrite",function(s){ return s.put(b,id); }); }, get:function(id){ return tx("readonly",function(s){ return s.get(id); }); }, del:function(id){ return tx("readwrite",function(s){ return s.delete(id); }); } };
  window.__offlineFiles=files;
  var assets={
    upload:function(b){ var id="f"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); return files.put(id,b).then(function(){ return {id:id, url:"_blob/"+id, sizeBytes:b.size, contentType:b.type}; }); },
    "delete":function(ref){ return files.del(typeof ref==="string"?ref:ref.id); },
    list:function(){ return Promise.resolve({assets:[], usage:{}}); }
  };
  window.claude={ use:function(name){ return Promise.resolve(name==="assets"?assets:null); } };
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
})();
</script>

/* subject ordering: within each category, same colors stay together (groups ordered by first appearance) */
function groupColors(arr){ const order=[]; arr.forEach(s=>{ if(!order.includes(s.color)) order.push(s.color); }); return order.flatMap(c=>arr.filter(s=>s.color===c)); }
function byCat(list){ const o={}; CATS.forEach(c=>o[c]=list.filter(s=>catOf(s.name)===c)); return o; }

function moveStep(name, dir){
  const list=subjList().map(s=>Object.assign({},s)), o=byCat(list), cat=catOf(name);
  let arr=groupColors(o[cat]); const i=arr.findIndex(s=>s.name===name), j=i+dir;
  if(i<0 || j<0 || j>=arr.length) return;
  const it=arr[i], nb=arr[j];
  if(nb.color===it.color){ [arr[i],arr[j]]=[arr[j],arr[i]]; }
  else { const G=[]; arr.forEach(s=>{ if(!G.includes(s.color)) G.push(s.color); }); const a=G.indexOf(it.color), b=G.indexOf(nb.color); [G[a],G[b]]=[G[b],G[a]]; arr=G.flatMap(c=>arr.filter(s=>s.color===c)); }
  o[cat]=arr; saveSubjects(rebuild(o, list)); render(true);
}
function moveTo(name, targetCat, refName, after){
  const list=subjList().map(s=>Object.assign({},s)), it=list.find(s=>s.name===name); if(!it || !CATS.includes(targetCat)) return;
  const newName=targetCat+"-"+shortName(name);
  if(newName!==name && list.some(s=>s.name===newName)){ toast(`「${newName}」已經存在`); return; }
  const rest=list.filter(s=>s!==it); it.name=newName;
  const o=byCat(rest), arr=o[targetCat];
  let idx=refName ? arr.findIndex(s=>s.name===refName) : -1;
  if(idx<0) arr.push(it); else arr.splice(idx+(after?1:0), 0, it);
  saveSubjects(rebuild(o, rest));
  if(newName!==name){ renameRefs(name, newName); toast(`已移到「${newName}」`); }
  render(true);
}

/* add article words that are not yet in the word bank; returns how many were added */
function addWordsToBank(words, subj, chap, sec){
  let n=0; const mine=myEnMap();
  for(const k of words){
    if(!k || !k.front || mine.has(k.front)) continue;
    const c=newCard(Object.assign({id:"w-"+slug(k.front), front:k.front, back:k.back||"", pos:k.pos||"", example:k.example||"", lang:"en", subject:subj||READ_SUBJ, source:"reading"}, chap?{chapter:chap, section:sec||""}:{}));
    putCard(c); mine.set(k.front, c); n++;
  }
  return n;
}

const RATES=[0.6,0.8,1,1.2,1.5];
const RD={on:false, i:0, sents:[], gen:0, rate:1};
try{ const r=parseFloat(localStorage.getItem("hs-read-rate")); if(RATES.includes(r)) RD.rate=r; }catch(e){}
/* split text into word / non-word segments, each tagged with its sentence number */
function splitParts(text){
  const raw=String(text||"").split(/([A-Za-z]+(?:['’][A-Za-z]+)?)/), segs=[], sents=[""]; let s=0;
  raw.forEach((p,i)=>{
    if(!p) return;
    if(i%2===1){ segs.push({t:p, s, w:true}); sents[s]+=p; return; }
    const re=/[.!?]+["'”’)\]]*(?=\s|$)|\n/g; let last=0, m;
    while((m=re.exec(p))){
      const end=m.index+m[0].length, head=p.slice(last,end);
      segs.push({t:head, s}); sents[s]+=head; last=end;
      if(/[A-Za-z0-9]/.test(sents[s])){ s++; sents[s]=""; }
    }
    if(last<p.length){ const tail=p.slice(last); segs.push({t:tail, s}); sents[s]+=tail; }
  });
  return {segs, sents};
}
const hasWords = x => /[A-Za-z0-9]/.test(x);
function readbarHtml(){
  const sents=splitParts(S.ui.extract.text).sents, n=sents.filter(hasWords).length;
  const started=RD.on||RD.i>0, k=sents.slice(0,RD.i+1).filter(hasWords).length;
  const label=RD.on?"暫停":started?"繼續朗讀":"朗讀全文";
  return `<button class="btn sm primary" data-act="tts-play" aria-label="${label}">${RD.on?"":ICON_SPEAK}${label}</button>`
    + (started?`<button class="btn sm" data-act="tts-stop">停止</button>`:"")
    + `<span class="muted small">語速</span><span class="seg" role="group" aria-label="朗讀語速">${RATES.map(r=>`<button data-act="tts-rate" data-v="${r}" aria-pressed="${RD.rate===r}">${r}×</button>`).join("")}</span>`
    + (started?`<span class="muted small">第 ${k} / ${n} 句</span>`:"");
}
function updReadUI(){
  const b=$("#readbar"); if(b) b.innerHTML=readbarHtml();
  document.querySelectorAll("#reader .reading").forEach(el=>el.classList.remove("reading"));
  if(RD.on||RD.i>0){
    const els=document.querySelectorAll(`#reader [data-s="${RD.i}"]`);
    els.forEach(el=>el.classList.add("reading"));
    if(RD.on && els[0]){ try{ els[0].scrollIntoView({block:"nearest", behavior:"smooth"}); }catch(e){} }
  }
}
function readNext(){
  const g=++RD.gen;
  while(RD.i<RD.sents.length && !hasWords(RD.sents[RD.i])) RD.i++;
  if(RD.i>=RD.sents.length){ RD.on=false; RD.i=0; updReadUI(); toast("整篇念完了"); return; }
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(RD.sents[RD.i].trim()); u.lang="en-US"; u.rate=RD.rate; if(voice) u.voice=voice;
    const next=()=>{ if(g!==RD.gen || !RD.on) return; RD.i++; readNext(); };
    u.onend=next; u.onerror=next;
    speechSynthesis.speak(u);
  }catch(e){ RD.on=false; toast("沒辦法播放發音"); }
  updReadUI();
}
function readStart(){
  if(!("speechSynthesis" in window)){ toast("這個瀏覽器不支援朗讀"); return; }
  RD.sents=splitParts(S.ui.extract.text).sents;
  if(RD.i>=RD.sents.length) RD.i=0;
  RD.on=true; readNext();
}
function readPause(){ RD.on=false; RD.gen++; try{ speechSynthesis.cancel(); }catch(e){} updReadUI(); }
function readStop(){ const was=RD.on||RD.i>0; RD.on=false; RD.gen++; RD.i=0; if(was){ try{ speechSynthesis.cancel(); }catch(e){} updReadUI(); } }
function setRate(r){
  if(!RATES.includes(r)) return; RD.rate=r;
  try{ localStorage.setItem("hs-read-rate", String(r)); }catch(e){}
  if(RD.on) readNext(); else updReadUI();
}

function onWriteErr(e){
  const c=e && e.code;
  if(c==="invalid_argument") toast("沒辦法儲存：你目前可能只有檢視權限");
  else if(c==="quota_exceeded") toast("儲存空間滿了，刪掉一些卡片或筆記再試");
  else if(c==="revoked"){ S.mode="err"; setSync(); toast("存取權限已變更，重新整理頁面看看"); }
  else toast("儲存失敗，請稍後再試");
}
function queue(key, fn){ chains[key]=(chains[key]||Promise.resolve()).then(fn).catch(onWriteErr); }
const plain = o => JSON.parse(JSON.stringify(o));
const isDb = () => S.mode==="db" || S.mode==="db-loading" || S.mode==="db-slow";
function putCard(c){ S.cards[c.id]=c; if(isDb()){ const b=plain(c); delete b.id; queue("c/"+c.id, ()=>BASE.collection("cards").doc(c.id).set(b)); } else saveLocal(); }
function delCard(id){ delete S.cards[id]; if(isDb()) queue("c/"+id, ()=>BASE.collection("cards").doc(id).delete()); else saveLocal(); }

function startSubs(){
  const got={c:false,n:false,m:false,r:false,q:false};
  const done=()=>{ if(got.c&&got.n&&got.m&&got.r&&got.q && S.mode!=="db"){ S.mode="db"; clearTimeout(slowT); migrate(); } };
  const slowT=setTimeout(()=>{ if(S.mode!=="db"){ S.mode="db-slow"; setSync(); } }, 10000);
  const errH = e => { clearTimeout(slowT); if(e && e.code==="revoked"){ S.mode="err"; } else { S.mode="db-slow"; } setSync(); };
  BASE.collection("cards").onSnapshot(snap=>{ const o={}; for(const d of snap.docs){ o[d.id]=Object.assign({}, d.data(), {id:d.id}); } S.cards=o; if(!snap.metadata.fromCache) got.c=true; done(); render(); }, errH);
  BASE.collection("notes").onSnapshot(snap=>{ const o={}; for(const d of snap.docs){ o[d.id]=Object.assign({}, d.data(), {id:d.id}); } S.notes=o; if(!snap.metadata.fromCache) got.n=true; done(); render(); }, errH);
  BASE.collection("questions").onSnapshot(snap=>{ const o={}; for(const d of snap.docs){ o[d.id]=Object.assign({}, d.data(), {id:d.id}); } S.questions=o; if(!snap.metadata.fromCache) got.q=true; done(); render(); }, errH);
  BASE.collection("readings").onSnapshot(snap=>{ const o={}; for(const d of snap.docs){ o[d.id]=Object.assign({}, d.data(), {id:d.id}); } S.readings=o; if(!snap.metadata.fromCache) got.r=true; done(); render(); }, errH);
  BASE.onSnapshot(snap=>{ if(snap.exists){ const d=snap.data(); S.meta={subjectList:Array.isArray(d.subjectList)?d.subjectList.map(s=>Object.assign({},s)):undefined, readSubjV1:!!d.readSubjV1, autoVocab:d.autoVocab, exams:(d.exams||[]).map(x=>Object.assign({},x,{chs:(x.chs||[]).slice()})), activity:Object.assign({}, d.activity||{}), quizzes:(d.quizzes||[]).map(q=>Object.assign({},q))}; } if(!snap.metadata.fromCache) got.m=true; done(); render(); }, errH);
}

async function init(){
  route(); render(true);
  if(!window.claude || typeof window.claude.use!=="function"){ goLocal(); return; }
  window.claude.use("sample").then(s=>{ if(s){ S.sample=s; render(); s.limits().then(l=>{ S.imgLimits=(l&&l.images)||null; S.limitsLoaded=true; render(); }).catch(()=>{ S.limitsLoaded=true; render(); }); } else { S.limitsLoaded=true; render(); } }).catch(()=>{ S.limitsLoaded=true; });
  try{
    const [db,user]=await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    const id = user ? await user.id() : null;
    if(!db || !id){ goLocal(); return; }
    BASE=db.doc("data/users/"+id+"/app"); S.mode="db-loading"; setSync(); startSubs();
    db.collection("articles").orderBy("date","desc").limit(60).onSnapshot(snap=>{ S.articles=snap.docs.map(d=>Object.assign({}, d.data(), {id:d.id})).filter(a=>a.body); render(); }, ()=>{});
  }catch(e){ goLocal(); }
}

function newCard(f){
  return Object.assign({front:"",back:"",subject:DEF_SUBJ,pos:"",example:"",lang:"en",box:0,due:0,reviews:0,correct:0,wrong:0,addedAt:Date.now(),source:"manual"}, f);
}
function addWord(info, source){
  const front=info.front.trim(); if(!front) return null;
  const en=isEn(front);
  if(en){ const ex=myEnMap().get(front.toLowerCase()); if(ex){ toast(`「${front}」已經在單字庫裡`); return ex; } }
  const id = en ? "w-"+slug(front) : rid("c");
  const c=newCard({id, front: en?front.toLowerCase():front, back:info.back||"", pos:info.pos||"", example:info.example||"", lang:en?"en":"zh", subject:info.subject||(source==="extract"||source==="reading"?READ_SUBJ:DEF_SUBJ), source});
  putCard(c); return c;
}
function grade(c, ok){
  c=Object.assign({}, c);
  c.reviews=(c.reviews||0)+1;
  if(ok){ c.correct=(c.correct||0)+1; c.box=Math.min(6,(c.box||0)+1); }
  else { c.wrong=(c.wrong||0)+1; c.box=1; }
  c.due = ok ? Date.now()+INTERVALS[c.box]*DAY : Date.now();
  c.lastAt=Date.now();
  putCard(c); logActivity(); return c;
}

/* ---------- lemmas / extraction ---------- */
function cands(w){
  const a=[w];
  if(w.endsWith("ies")) a.push(w.slice(0,-3)+"y");
  if(w.endsWith("es")) a.push(w.slice(0,-2));
  if(w.endsWith("s")) a.push(w.slice(0,-1));
  if(w.endsWith("ied")) a.push(w.slice(0,-3)+"y");
  if(w.endsWith("ed")){ const b=w.slice(0,-2); a.push(b, w.slice(0,-1)); if(/([bcdfgklmnprstvz])\1$/.test(b)) a.push(b.slice(0,-1)); }
  if(w.endsWith("ing")){ const b=w.slice(0,-3); a.push(b, b+"e"); if(/([bcdfgklmnprstvz])\1$/.test(b)) a.push(b.slice(0,-1)); }
  if(w.endsWith("ily")) a.push(w.slice(0,-3)+"y");
  if(w.endsWith("ly")) a.push(w.slice(0,-2));
  return a;
}
function keyMap(){ const m=new Map(HSMAP); for(const a of S.ui.extract.ai) m.set(a.front, a); return m; }
function lemmaOf(w, keys, mine){ for(const c of cands(w)){ if(mine.has(c) || keys.has(c)) return c; } return w; }
function sentenceFor(raw){ const parts=S.ui.extract.text.split(/(?<=[.!?])\s+/); return parts.find(p=>new RegExp("\\b"+raw.replace(/[^A-Za-z']/g,"")+"\\b","i").test(p)) || ""; }

/* ---------- views ---------- */
function defaultTitle(){
  const X=S.ui.extract, rd=X.readingId && S.readings[X.readingId];
  if(rd && rd.title) return rd.title;
  const art=X.articleId && S.articles.find(a=>a.id===X.articleId);
  if(art && art.title) return art.title;
  const w=(X.text.match(/[A-Za-z][A-Za-z'’-]*/g)||[]).slice(0,8).join(" ");
  return w ? w+"…" : "未命名文章";
}
/* every highlighted word in the current text: built-in / Claude key words, plus words already in the bank */
function textWords(){
  const X=S.ui.extract, keys=keyMap(), mine=myEnMap(), out=[], seen=new Set();
  for(const m of X.text.matchAll(/[A-Za-z]+(?:['’][A-Za-z]+)?/g)){
    const lem=lemmaOf(m[0].toLowerCase(), keys, mine); if(seen.has(lem)) continue;
    const k=keys.get(lem) || mine.get(lem); if(!k) continue;
    seen.add(lem); out.push({front:lem, pos:String(k.pos||""), back:String(k.back||""), example:String(k.example||sentenceFor(m[0])||"")});
  }
  return out;
}

function quizPool(){
  const Q=S.ui.quiz;
  let p = Q.source==="hs" ? deckCards("hs") : deckCards("mine", Q.subject, Q.chapter).filter(c=>c.back);
  if(Q.type==="listen") p=p.filter(c=>c.lang==="en");
  return p;
}
function startQuiz(){
  const Q=S.ui.quiz, pool=quizPool(); if(pool.length<4){ toast("題目不夠，至少要 4 張卡片"); return; }
  const picks=shuffle(pool).slice(0,10);
  const qs=picks.map(card=>{
    let type=Q.type;
    if(type==="mix"){ const opts=["en2zh","zh2en"]; if(card.lang==="en") opts.push("listen"); type=opts[Math.floor(Math.random()*opts.length)]; }
    const same=pool.filter(c=>c.id!==card.id && c.subject===card.subject);
    const others=shuffle(same.length>=3?same:pool.filter(c=>c.id!==card.id));
    const field = type==="zh2en" ? "front" : "back";
    const right=card[field], opts=[right];
    for(const o of others){ if(opts.length>=4) break; if(o[field] && !opts.includes(o[field])) opts.push(o[field]); }
    const choices=shuffle(opts);
    return {card, type, choices, answer:choices.indexOf(right), picked:null};
  });
  Q.run={qs, i:0, score:0};
  render(true);
  const first=qs[0]; if(first.type==="listen") setTimeout(()=>speak(first.card.front),250);
}
function pickAnswer(i){
  const run=S.ui.quiz.run; if(!run) return; const q=run.qs[run.i]; if(!q || q.picked!=null) return;
  q.picked=i; const ok=i===q.answer; if(ok) run.score++;

/* chapters: "第三章", "Ch 3", "3. 動量" sort by their number; sections like "3.6" sort by each number in them */
const CN_D={零:0,〇:0,一:1,二:2,兩:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};
function cnNum(t){ if(/^\d+$/.test(t)) return Number(t); let n=0,cur=0; for(const ch of t){ if(ch==="十"){ n+=(cur||1)*10; cur=0; } else if(ch==="百"){ n+=(cur||1)*100; cur=0; } else cur=CN_D[ch]??0; } return n+cur; }
function chapNum(c){ const m=/(\d+|[零〇一二兩三四五六七八九十百]+)/.exec(c||""); return m?cnNum(m[1]):Infinity; }

function secNums(x){ return (String(x||"").match(/\d+/g)||[]).map(Number); }
function secSort(a,b){ if(!a||!b) return (a?1:0)-(b?1:0); const x=secNums(a), y=secNums(b); for(let i=0;i<Math.max(x.length,y.length);i++){ const d=(x[i]??-1)-(y[i]??-1); if(d) return d; } return String(a).localeCompare(String(b),"zh-TW"); }

function pathSorter(order){ return (x,y)=>(order.indexOf(x.s)-order.indexOf(y.s)) || ((x.ch?0:1)-(y.ch?0:1)) || chapSort(x.ch,y.ch) || secSort(x.sec,y.sec); }
/* a card's place: set on the card itself, otherwise taken from the note it was made from (so moving a note moves its cards) */
function noteChapMap(){ const m=new Map(); for(const n of Object.values(S.notes)){ const ch=chapOf(n); if(!ch) continue; for(const l of noteCardLines(n)){ const k=n.subject+"|"+l[1].trim().toLowerCase(); if(!m.has(k)) m.set(k,{ch, sec:secOf(n)}); } } return m; }

function pathsOf(subj){

  for(const n of Object.values(S.notes)) if(n.subject===subj) add(chapOf(n), secOf(n));

  for(const q of Object.values(S.questions||{})) if(q.subject===subj) add(chapOf(q), secOf(q));

function chaptersOf(subj){ return [...new Set(pathsOf(subj).map(p=>p.ch))]; }

function chapterCardIds(subj, ch, sec){ const m=noteChapMap(); return Object.values(S.cards).filter(c=>{ if(c.subject!==subj) return false; const p=cardPath(c,m); return p.ch===ch && (!sec || p.sec===sec); }).map(c=>c.id); }

/* ---------- images inside notes: a line "[圖片:<asset id>]" ---------- */
const IMG_RE=/^\s*\[圖片:([^\]\s]+)\]\s*$/;
function noteImgIds(body){ return String(body||"").split("\n").map(l=>IMG_RE.exec(l)).filter(Boolean).map(m=>m[1]); }
/* links: [文字](https://…) or a bare https://… become clickable */
function inl(t){
  t=String(t??""); const re=/\[([^\]\n]{1,200})\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[A-Za-z0-9\-._~:/?#@!$&*+,;=%\[\]]*[A-Za-z0-9\-_~/#=&%+])/g;

  while((m=re.exec(t))){ const url=m[2]||m[3], label=m[1]||m[3]; out+=esc(t.slice(last,m.index))+`<a class="nlink" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`; last=re.lastIndex; }
  return out+esc(t.slice(last));
}
function normUrl(u){ u=String(u||"").trim(); if(!u) return ""; if(!/^https?:\/\//i.test(u)) u="https://"+u; try{ const x=new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ""; }catch(e){ return ""; } }
/* tables in notes: Markdown-style lines "| a | b |" */
const isTblLine = l => /^\s*\|/.test(l||"");
const isSepRow = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l||"");
function parseRow(l){ let t=l.trim(); if(t.startsWith("|")) t=t.slice(1); if(t.endsWith("|")) t=t.slice(0,-1); return t.split("|").map(x=>x.trim()); }
function tableEnd(L, i){ let j=i; while(j<L.length && isTblLine(L[j])) j++; return j; }
function tableMatrix(L, a, b){ const M=L.slice(a,b).filter(l=>!isSepRow(l)).map(parseRow); return M.length?M:[[""]]; }
function tableLines(M){

}

      continue; }

}

function inkOf(pdfId, pg){ const n=S.notes[PV.noteId]; return ((n && n.ink && n.ink[pdfId]) || {})[pg] || []; }
function inkDraw(box){
  const ov=box.querySelector(".pv-ink"); if(!ov) return; const ctx=ov.getContext("2d"), W=ov.width, H=ov.height;
  ctx.clearRect(0,0,W,H);
  for(const st of inkOf(PV.id, box.dataset.n)) inkStroke(ctx, st, W, H);
}
function inkStroke(ctx, st, W, H){
  const p=st.p; if(!p || p.length<2) return;
  ctx.save(); ctx.globalAlpha=st.a||1; ctx.strokeStyle=st.c; ctx.lineWidth=Math.max(1, st.w*W); ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.beginPath(); ctx.moveTo(p[0]*W, p[1]*H); if(p.length===2) ctx.lineTo(p[0]*W+0.1, p[1]*H); for(let i=2;i<p.length;i+=2) ctx.lineTo(p[i]*W, p[i+1]*H); ctx.stroke(); ctx.restore();
}
let inkCur=null;
function inkCancel(){ if(inkCur){ const b=inkCur.box; inkCur=null; inkDraw(b); } }
function inkSave(pdfId, pg, fn){
  const n=S.notes[PV.noteId]; if(!n) return;
  const ink=JSON.parse(JSON.stringify(n.ink||{})); const P=ink[pdfId]||(ink[pdfId]={}); const L=P[pg]||(P[pg]=[]);
  fn(L); if(!L.length) delete P[pg]; if(!Object.keys(P).length) delete ink[pdfId];
  putNote(Object.assign({}, n, {ink, updatedAt:Date.now()}));
}
function pvInkEvents(el){
  const pos=(e,ov)=>{ const r=ov.getBoundingClientRect(); return [Math.round(((e.clientX-r.left)/r.width)*10000)/10000, Math.round(((e.clientY-r.top)/r.height)*10000)/10000]; };
  el.addEventListener("pointerdown", e=>{
    const ov=e.target.closest && e.target.closest(".pv-ink"); if(!ov || !PV.tool) return;
    if(inkCur && inkCur.pid!==e.pointerId){ inkCancel(); return; }
    e.preventDefault(); const box=ov.parentNode, pg=box.dataset.n, [x,y]=pos(e,ov);
    if(PV.tool==="eraser"){ inkCur={erase:true, box, pg, pid:e.pointerId}; inkErase(box, pg, x, y); }
    else { const T=INK_TOOLS[PV.tool]; inkCur={box, pg, pid:e.pointerId, st:{c:PV.tool==="hl"?"#ffd400":PV.color, w:T.w, a:T.a, p:[x,y]}}; inkStroke(ov.getContext("2d"), inkCur.st, ov.width, ov.height); }
    try{ ov.setPointerCapture(e.pointerId); }catch(_){}
  });
  el.addEventListener("pointermove", e=>{
    if(!inkCur || e.pointerId!==inkCur.pid) return; e.preventDefault();
    const ov=inkCur.box.querySelector(".pv-ink"), [x,y]=pos(e,ov);
    if(inkCur.erase){ inkErase(inkCur.box, inkCur.pg, x, y); return; }
    const p=inkCur.st.p, lx=p[p.length-2], ly=p[p.length-1]; if(Math.hypot(x-lx,y-ly)<0.0015) return;
    p.push(x,y); const ctx=ov.getContext("2d"); ctx.save(); ctx.globalAlpha=inkCur.st.a; ctx.strokeStyle=inkCur.st.c; ctx.lineWidth=Math.max(1,inkCur.st.w*ov.width); ctx.lineCap="round"; ctx.beginPath(); ctx.moveTo(lx*ov.width, ly*ov.height); ctx.lineTo(x*ov.width, y*ov.height); ctx.stroke(); ctx.restore();
  });
  const up=e=>{ if(!inkCur || e.pointerId!==inkCur.pid) return; const c=inkCur; inkCur=null;
    if(c.erase) return;
    if(c.st.p.length>=2){ inkSave(PV.id, c.pg, L=>L.push(c.st)); PV.hist.push({pdf:PV.id, pg:c.pg}); inkDraw(c.box); } };
  el.addEventListener("pointerup", up); el.addEventListener("pointercancel", e=>{ if(inkCur && e.pointerId===inkCur.pid) inkCancel(); });
}
function inkErase(box, pg, x, y){
  const L=inkOf(PV.id, pg), r=0.015; const hit=L.findIndex(st=>{ for(let i=0;i<st.p.length;i+=2) if(Math.hypot(st.p[i]-x, st.p[i+1]-y)<r+st.w) return true; return false; });
  if(hit<0) return; inkSave(PV.id, pg, A=>A.splice(hit,1)); inkDraw(box);
}
function inkUndo(){
  const h=PV.hist.pop(); if(!h){ toast("沒有可以復原的筆跡"); return; }
  inkSave(h.pdf, h.pg, L=>L.pop()); const box=PV.el && PV.el.querySelector(`.pv-page[data-n="${h.pg}"]`); if(box && h.pdf===PV.id) inkDraw(box);
}
function pvSetTool(t){ PV.tool = PV.tool===t ? null : t; if(PV.el) PV.el.classList.toggle("inking", !!PV.tool); render(true); }

const PDFTXT={};
async function pdfTextOf(id, name){
  if(PDFTXT[id]!=null) return PDFTXT[id];
  try{ const m=await readPdf(new File([await blobOf(id)], name||"講義.pdf", {type:"application/pdf"})); PDFTXT[id]=m.text||""; try{ m.doc.destroy(); if(m.url) URL.revokeObjectURL(m.url); }catch(e){} }
  catch(e){ PDFTXT[id]=""; }
  return PDFTXT[id];
}

async function askNote(){

  const A=(N.ask||(N.ask={}))[n.id]||(N.ask[n.id]=[]); if(A.some(x=>x.busy)) return;
  const it={q, a:"", busy:true}; A.push(it); N.askOpen=true; N.askCtl=new AbortController(); render(true);
  try{
    let mat=`=== 筆記：${n.title||"未命名"}（${shortName(n.subject)} — ${pathLabel(chapOf(n),secOf(n))}）===\n${String(n.body||"").replace(/^\s*\[圖片:[^\]]+\]\s*$/gm,"（圖片）")}`;
    for(const f of (n.pdfs||[])){ const t=await pdfTextOf(f.id, f.name); if(t) mat+=`\n\n=== PDF：${f.name} ===\n${t}`; }
    if(mat.length>TEXT_CAP) mat=mat.slice(0,TEXT_CAP)+"\n（後面太長，已省略）";
    const images=[]; const maxI=Math.min(3,(S.imgLimits&&S.imgLimits.maxCount)||0);

規則：全部用繁體中文（台灣用語），絕對不可以出現簡體字；回答簡潔、條列清楚；公式用一般文字寫（例如 F = ma）。
如果筆記和講義裡沒有相關內容，先說「筆記裡沒有提到」，再用一般知識簡短補充，並在補充的地方標「（筆記外補充）」。
${images.length?`另外附上筆記裡的 ${images.length} 張圖片。\n`:""}
${mat}`;
    const turns=[]; A.forEach((x,i)=>{ turns.push({role:"user", content:(i===0?rules+"\n\n學生的問題：":"")+x.q}); if(x!==it && x.a) turns.push({role:"assistant", content:x.a}); });

}

async function blobOf(id){ const r=await fetch("_blob/"+encodeURIComponent(id)); if(!r.ok) throw new Error("fetch"); return r.blob(); }
/* read notes + their PDFs / photos and ask Claude for questions; returns [{kind:"mc", q, opts, ans, ex} | {kind:"written", q}] */
async function makeQuestions(o){
  const {s:subj, label, src, n, type, existing, sig, msg}=o;
  const maxI=(S.imgLimits&&S.imgLimits.maxCount)||0, images=[];
  msg("正在整理筆記…");
  let text=src.notes.map(n=>`=== 筆記：${n.title||"未命名"} ===\n${String(n.body||"").replace(/^\s*\[圖片:[^\]]+\]\s*$/gm,"（圖片）")}`).join("\n\n");
  for(const f of src.pdfs){
    if(sig.aborted) throw {code:"cancelled"};
    msg(`正在讀 PDF「${f.name}」…`);
    try{
      const m=await readPdf(new File([await blobOf(f.id)], f.name, {type:"application/pdf"}));
      if(m.text) text+=`\n\n=== PDF：${f.name} ===\n${m.text}`;
      for(const no of m.scanned){ if(images.length>=maxI) break; try{ images.push(await renderPage(await m.doc.getPage(no), 1400)); }catch(e){} }
      try{ m.doc.destroy(); if(m.url) URL.revokeObjectURL(m.url); }catch(e){}
    }catch(e){ toast(e&&e.pdfLoad?"PDF 工具載入失敗，這次只用筆記出題":`「${f.name}」讀取失敗，這次先跳過`); }
  }
  for(const id of src.imgs){ if(images.length>=maxI) break; try{ images.push(await blobOf(id)); }catch(e){} }
  if(sig.aborted) throw {code:"cancelled"};
  if(text.length>TEXT_CAP) text=text.slice(0,TEXT_CAP)+"\n（後面內容太長，已省略）";
  const typeTxt={mix:"大約一半選擇題、一半手寫題（簡答、計算或推導）", mc:"全部是四選一選擇題", short:"全部是手寫的簡答題", calc:"全部是手寫的計算或推導題", tf:"全部是是非題（當成只有「對」「錯」兩個選項的選擇題）"}[type]||"混合";
  msg("Claude 正在出題，大約 20～90 秒…");
  const prompt=`你是台灣大學「${shortName(subj)}」課的助教。下面是學生在「${label}」的筆記和講義${images.length?`（另外附上 ${images.length} 張相關的圖片或掃描頁）`:""}。請根據這些內容，出 ${n} 題練習題，幫學生準備考試。
規則：
- 全部用繁體中文（台灣用語），絕對不可以出現簡體字；專有名詞可以附英文原文。
- 只根據資料裡的內容出題，不要考資料沒教的東西；題目要涵蓋不同重點，由淺到深。
- 題型：${typeTxt}。
- 選擇題：type 寫 "mc"；q 只寫題幹，選項放在 options（四個選項；是非題就是 ["對","錯"]）；answer 寫正確選項的字母（A、B、C、D）；ex 寫詳解，說明為什麼。
- 手寫題（簡答、計算、推導）：type 寫 "written"，只要題目 q，不要給答案和詳解。
- 公式用一般文字寫，例如 F = ma、Q(t+1) = D。
${existing&&existing.length?`- 不要和這些已經有的題目重複：\n${existing.map(x=>"  · "+x).join("\n")}\n`:""}只回覆一個 JSON 陣列，不要其他文字，格式：[{"type":"mc","q":"題幹","options":["選項一","選項二","選項三","選項四"],"answer":"B","ex":"詳解"},{"type":"written","q":"題目"}]

資料：
<<<
${text}
>>>`;
  const opts={modelTier:"default", signal:sig}; if(images.length) opts.images=images;
  const r=await S.sample.json(prompt, opts);
  const str=x=>typeof x==="string"?x.trim():"";
  return (Array.isArray(r)?r:[]).filter(x=>x && str(x.q)).slice(0,20).map(x=>{
    const op=Array.isArray(x.options)?x.options.map(str).filter(Boolean).slice(0,6):[], ai=LETTERS.indexOf(str(x.answer).replace(/[^A-Fa-f]/g,"").slice(0,1).toUpperCase());

    return {kind:"written", q:str(x.q).slice(0,4000)};
  });
}
const genErr = e => { const c=e && e.code; if(["sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)) S.sample=null; if(c!=="cancelled") toast(photoMsg(c)); };

/* multiple choice: option lines "(A) …" in the question, answer starting with the letter, e.g. "(B) 0110" or "B" */
const LETTERS="ABCDEF";
function mcParse(q){
  if(!q || q.kind==="written") return null;
  const L=String(q.q||"").split("\n"), opts=[], stem=[];
  for(const l of L){ const m=/^\s*[（(]?\s*([A-Fa-f])\s*[)）.、．:：]\s*(.+?)\s*$/.exec(l); if(m && opts.length<6 && m[1].toUpperCase()===LETTERS[opts.length]) opts.push({k:m[1].toUpperCase(), t:m[2]}); else if(!opts.length || !l.trim()) stem.push(l); else stem.push(l); }
  if(opts.length<2) return null;
  const am=/^\s*[（(]?\s*([A-Fa-f])\s*(?:[)）.、．:：]|\s|$)/.exec(String(q.a||""));
  const ans=am ? am[1].toUpperCase() : null;
  if(!ans || !opts.some(o=>o.k===ans)) return null;
  return {stem:stem.join("\n").trim(), opts, ans};
}
const isWritten = q => q && !mcParse(q) && !String(q.a||"").trim() && !String(q.ex||"").trim() && !(q.pdfs||[]).some(p=>p.f==="a"||p.f==="ex");
function mcHtml(q, mc, picked, act, locked){
  const stem=Object.assign({}, q, {q:mc.stem});
  return `${mc.stem?qText(stem,"q",false):""}<div class="choices mcq">${mc.opts.map(o=>{ let cls="choice"; if(picked){ if(o.k===mc.ans) cls+=" right"; else if(o.k===picked) cls+=" wrong"; }
    return `<button class="${cls}" data-act="${act}" data-id="${esc(q.id)}" data-k="${o.k}"${locked&&picked?" disabled":""}><span class="k">${o.k}</span><span style="min-width:0;overflow-wrap:anywhere">${inl(o.t)}</span></button>`; }).join("")}</div>
    ${picked?`<p class="${picked===mc.ans?"done-tag":""}" style="margin:8px 0 0;${picked===mc.ans?"":"color:var(--bad);font-weight:700"}">${picked===mc.ans?"答對了！":`答錯了，正確答案是 (${mc.ans})`}</p>`:""}`;
}

async function gradeWritten(subj, qtext, ref, imgs, signal){

<<<
${String(qtext||"").replace(/^\s*\[圖片:[^\]]+\]\s*$/gm,"（題目附圖）").slice(0,6000)}
>>>
${ref?`參考答案／詳解：\n<<<\n${String(ref).slice(0,6000)}\n>>>`:"這題沒有參考答案，請你自己算出正確答案後再批改。"}
規則：
- 全部用繁體中文（台灣用語），絕對不可以出現簡體字；公式用一般文字（例如 F = ma）。
- 先辨識學生寫了什麼，再一步一步檢查。指出第一個出錯的地方在哪一步、為什麼錯。
- 照片看不清楚的地方要說出來，不要亂猜。
只回覆一個 JSON 物件，不要其他文字：
{"verdict":"對、部分對、錯 三選一","score":0到100的整數,"read":"你辨識到的學生答案重點（一兩句）","feedback":"整體評語（一兩句）","steps":["錯誤或可以改進的地方，一條一點"],"solution":"正確的完整解法，條列步驟"}`, {images:imgs, modelTier:"default", signal});
  const str=x=>typeof x==="string"?x.trim():"";
  const v=["對","部分對","錯"].includes(str(r&&r.verdict)) ? str(r.verdict) : (Number(r&&r.score)>=80?"對":Number(r&&r.score)>=40?"部分對":"錯");

}

/* weakest places: wrong answers on questions and flashcards, grouped by subject — chapter — section */
function weakSpots(limit){
  const m=noteChapMap(), agg=new Map();
  const add=(s,ch,sec,w,r)=>{ const k=s+PSEP+ch+PSEP+sec, o=agg.get(k)||{s,ch,sec,w:0,r:0,miss:0}; o.w+=w; o.r+=r; agg.set(k,o); return o; };
  for(const q of Object.values(S.questions)){ const o=add(q.subject,chapOf(q),secOf(q),q.wrong||0,q.right||0); if(q.miss) o.miss++; }
  for(const c of Object.values(S.cards)){ if(!(c.wrong||c.correct)) continue; const p=cardPath(c,m); add(c.subject,p.ch,p.sec,c.wrong||0,c.correct||0); }
  return [...agg.values()].filter(o=>o.w>0).map(o=>Object.assign(o,{rate:o.w/Math.max(1,o.w+o.r)})).sort((a,b)=>(b.miss-a.miss)||(b.rate-a.rate)||(b.w-a.w)).slice(0,limit);

async function readPptx(file){

      finally{ P.loading--; render(true); }
      continue;
    }
    if(f.type==="application/pdf" || /\.pdf$/i.test(f.name||"")){
      if(f.size>60e6){ toast(`「${f.name}」太大了（超過 60MB）`); continue; }
      P.loading=(P.loading||0)+1; render(true);
      try{ const m=await readPdf(f); P.items.push(m); P.result=null; if(m.pages>PDF_MAX_PAGES) toast(`「${f.name}」有 ${m.pages} 頁，只會整理前 ${PDF_MAX_PAGES} 頁`); }

      finally{ P.loading--; render(true); }
      continue;
    }
    if((types.length && !types.includes(f.type)) || (L && L.maxInputBytes && f.size>L.maxInputBytes)){ skipped++; continue; }
    if(P.items.filter(x=>x.kind==="img").length>=maxI){ toast(`照片一次最多 ${maxI} 張`); continue; }

  }

  render(true);
}

/* paste → note as-is: turn Markdown headings/bold into plain text so it reads well in the note */
function cleanPaste(t){
  return String(t||"").replace(/\r\n?/g,"\n").split("\n").map(l=>{
    const h=/^\s{0,3}#{1,6}\s+(.+?)\s*#*\s*$/.exec(l); if(h) return "【"+h[1].replace(/\*\*|__/g,"")+"】";
    return l.replace(/\*\*(.+?)\*\*/g,"$1").replace(/__(.+?)__/g,"$1").replace(/^(\s*)[*+]\s+/,"$1- ");
  }).join("\n").replace(/\n{3,}/g,"\n\n").trim();
}

    case "q-run": { const B=S.ui.browse, items=bLeafItems(bData(B.s)).filter(q=>a.dataset.mode!=="wrong"||q.miss); if(!items.length) break; B.run={ids:shuffle(items.map(q=>q.id)), i:0, shown:false, picked:null, right:0, wrong:0, written:0}; render(true); window.scrollTo(0,0); break; }
    case "q-show": if(S.ui.browse.run){ S.ui.browse.run.shown=true; render(true); } break;
    case "q-run-pick": {
      const R=S.ui.browse.run; if(!R || R.picked) break; const q=S.questions[R.ids[R.i]], mc=mcParse(q); if(!mc) break;
      R.picked=a.dataset.k; const ok=R.picked===mc.ans;
      putQ(Object.assign({}, q, ok?{right:(q.right||0)+1, miss:false}:{wrong:(q.wrong||0)+1, miss:true}, {lastAt:Date.now()}));
      if(ok) R.right++; else R.wrong++; logActivity(); render(true); break;
    }
    case "q-next": { const R=S.ui.browse.run; if(!R) break; R.grade=null; if(a.dataset.done){ const q=S.questions[R.ids[R.i]]; if(q) putQ(Object.assign({}, q, {done:(q.done||0)+1, lastAt:Date.now()})); R.written=(R.written||0)+1; logActivity(); } R.i++; R.picked=null; R.shown=false; render(true); window.scrollTo(0,0); break; }
    case "q-pick": { const B=S.ui.browse, id=a.dataset.id; (B.picked||(B.picked={}))[id]=a.dataset.k; B.qOpen[id]=true; render(true); break; }
    case "q-grade": { const R=S.ui.browse.run; if(!R) break; const q=S.questions[R.ids[R.i]], ok=a.dataset.ok==="1"; if(q) putQ(Object.assign({}, q, ok?{right:(q.right||0)+1, miss:false}:{wrong:(q.wrong||0)+1, miss:true}, {lastAt:Date.now()})); if(ok) R.right++; else R.wrong++; logActivity(); R.i++; R.shown=false; render(true); break; }
    case "q-end": S.ui.browse.run=null; render(true); break;
    case "tbl": {
      const tl=+a.dataset.tl, op=a.dataset.op, T=tgtOf(a), ck="tbl:"+(T.k==="q"?`data-qid="${T.id}" data-f="${T.f}"`:"")+tl;
      if(op==="del" && T.k!=="ta" && S.confirm!==ck){ S.confirm=ck; render(true); break; }
      S.confirm=null;
      editLinesFor(T, L=>{
        if(!isTblLine(L[tl])) return false;
        const e2=tableEnd(L,tl), M=tableMatrix(L,tl,e2), w=Math.max(1,...M.map(r=>r.length));
        M.forEach(r=>{ while(r.length<w) r.push(""); });
        if(op==="addr") M.push(Array(w).fill(""));
        else if(op==="addc") M.forEach((r,ri)=>r.push(ri===0?"欄"+(w+1):""));
        else if(op==="delr"){ if(M.length>1) M.pop(); else return false; }
        else if(op==="delc"){ if(w>1) M.forEach(r=>r.splice(w-1,1)); else return false; }
        L.splice(tl, e2-tl, ...(op==="del"?[]:tableLines(M)));
      });
      if(T.k!=="ta") render(true); break;
    }
    case "nimg": {
      const li=+a.dataset.li, op=a.dataset.op, ck="img:"+li, T=tgtOf(a);
      if(op==="del" && T.k==="note" && S.confirm!==ck){ S.confirm=ck; render(true); break; }
      S.confirm=null; let gone=null;
      editLinesFor(T, L=>{
        const m=IMG_RE.exec(L[li]||""); if(!m) return false; const line=L[li];
        if(op==="del"){ L.splice(li,1); gone=m[1]; return; }
        const d=op==="up"?-1:1; let j=li+d;
        while(j>=0 && j<L.length && !L[j].trim()) j+=d;
        if(j<0 || j>=L.length){ toast(d<0?"已經在最上面了":"已經在最下面了"); return false; }
        if(isTblLine(L[j])){ if(d<0){ while(j>0 && isTblLine(L[j-1])) j--; } else { while(j+1<L.length && isTblLine(L[j+1])) j++; } }
        L.splice(li,1); L.splice(j,0,line);
      });
      if(gone){ if(T.k==="note") dropAsset(gone); toast("已刪除圖片"); }
      if(T.k!=="ta") render(true); break;
    }
    case "nimg-x": {
      const id=a.dataset.id, ck="imgx:"+id;
      if(S.confirm!==ck){ S.confirm=ck; render(true); break; }
      S.confirm=null;
      editNoteLines(L=>{ const i=L.findIndex(l=>{ const m=IMG_RE.exec(l); return m && m[1]===id; }); if(i<0) return false; L.splice(i,1); });
      dropAsset(id); toast("已刪除圖片"); render(true); break;
    }
    case "note-mode": S.ui.notes.mode=a.dataset.v==="view"?"view":"edit"; render(true); break;
    case "note-del": { const id=S.ui.notes.current, k="note:"+id; if(S.confirm===k){ delNote(id); S.ui.notes.current=null; S.confirm=null; toast("筆記已刪除"); } else S.confirm=k; render(true); break; }
    case "note-cards": {
      const n=S.notes[S.ui.notes.current]; if(!n) return;
      const existing=new Set(Object.values(S.cards).map(c=>c.subject+"|"+c.front.toLowerCase()));
      let added=0;
      for(const m of noteCardLines(n)){ const f=m[1].trim(), b=m[2].trim(), en=isEn(f); const key=n.subject+"|"+f.toLowerCase(); if(existing.has(key)) continue; if(en && myEnMap().has(f.toLowerCase())) continue; existing.add(key); putCard(newCard({id:en?"w-"+slug(f):rid("c"), front:en?f.toLowerCase():f, back:b, subject:n.subject, lang:en?"en":"zh", source:"note"})); added++; }
      toast(added?`做好 ${added} 張閃卡，去「閃卡」複習吧`:"這些重點都已經是閃卡了"); render(true); break;
    }
  }
});

document.addEventListener("keydown", e=>{
  if(e.target && e.target.id==="askQ" && e.key==="Enter" && (e.ctrlKey||e.metaKey)){ e.preventDefault(); askNote(); return; }
  if(e.target && e.target.isContentEditable){ if(e.key==="Enter"){ e.preventDefault(); e.target.blur(); } return; }
  if(/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||""))) return;
  if(e.key==="Escape" && S.sheet){ S.sheet=null; render(true); return; }
  if(S.view==="cards" && S.ui.cards.session){
    const s=S.ui.cards.session; if(s.i>=s.ids.length) return;
    if(e.key===" "||e.key==="Enter"){ e.preventDefault(); if(!s.flipped){ s.flipped=true; render(true); } }
    else if(e.key==="ArrowLeft" && s.flipped) gradeCurrent(false);
    else if(e.key==="ArrowRight" && s.flipped) gradeCurrent(true);
    else if(e.key==="p"||e.key==="P"){ const id=s.ids[s.i]; const c=id.startsWith("hs:")?HSMAP.get(id.slice(3)):S.cards[id]; if(c && isEn(c.front)) speak(c.front); }
  }
  if(S.view==="quiz" && S.ui.quiz.run){
    const run=S.ui.quiz.run, q=run.qs[run.i]; if(!q) return;
    if(/^[1-4]$/.test(e.key) && q.picked==null && Number(e.key)<=q.choices.length) pickAnswer(Number(e.key)-1);
    else if(e.key==="Enter" && q.picked!=null){ e.preventDefault(); nextQuestion(); }
  }
});

/* drag & drop for subjects (desktop); phones use the ↑↓ buttons and category menu */
let dragName=null;
function clearDrop(){ document.querySelectorAll(".drop-before,.drop-after,.drop-col").forEach(el=>el.classList.remove("drop-before","drop-after","drop-col")); }
document.addEventListener("dragstart", e=>{
  const r=e.target.closest && e.target.closest("[data-drag]"); if(!r) return;
  if(/^(SELECT|BUTTON|OPTION)$/.test(e.target.tagName)){ e.preventDefault(); return; }
  dragName=r.dataset.drag; r.classList.add("dragging");
  try{ e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain", dragName); }catch(_){}
});
document.addEventListener("dragend", ()=>{ dragName=null; clearDrop(); document.querySelectorAll(".dragging").forEach(el=>el.classList.remove("dragging")); });
document.addEventListener("dragover", e=>{
  if(!dragName) return;
  const row=e.target.closest("[data-drag]"), col=e.target.closest("[data-dropcat]");
  if(!row && !col) return;
  e.preventDefault(); clearDrop();
  if(row && row.dataset.drag!==dragName){ const b=row.getBoundingClientRect(); row.classList.add(e.clientY < b.top+b.height/2 ? "drop-before" : "drop-after"); }
  else if(col) col.classList.add("drop-col");
});
document.addEventListener("drop", e=>{
  if(!dragName) return;
  const row=e.target.closest("[data-drag]"), col=e.target.closest("[data-dropcat]");
  if(!row && !col) return;
  e.preventDefault(); const name=dragName; dragName=null; clearDrop();
  if(row && row.dataset.drag!==name){ const b=row.getBoundingClientRect(); moveTo(name, catOf(row.dataset.drag), row.dataset.drag, e.clientY >= b.top+b.height/2); }
  else if(col && !row) moveTo(name, col.dataset.dropcat, null, false);
});

function gradeCurrent(ok){
  const s=S.ui.cards.session; if(!s || !s.flipped) return;
  const id=s.ids[s.i];
  if(id.startsWith("hs:")){
    const w=id.slice(3), mine=myEnMap().get(w);
    if(mine) grade(mine, ok);
    else { if(!ok){ const c=addWord(Object.assign({}, HSMAP.get(w)), "hs"); if(c) grade(c,false); } else logActivity(); }
  } else if(S.cards[id]){ grade(S.cards[id], ok); }
  if(ok) s.known++; else { s.again++; if(!s.requeued[id] && !id.startsWith("hs:")){ s.requeued[id]=1; s.ids.push(id); } }
  s.i++; s.flipped=false; render(true);
}

async function runAI(){
  const X=S.ui.extract; if(!S.sample || X.busy) return;
  X.busy=true; X.ctl=new AbortController(); render(true);
  const kn=vocabAvoid().known;
  const prompt=`你是台灣的大學英文老師。從下面的英文文章挑出 8 到 15 個值得大學生學的單字：學術或進階的重點單字，加上一般大學生可能不認識的字（太簡單的字不要，例如 the、student、important）。${kn.length?`\n學生已經熟練、不要再挑：${kn.join(", ")}`:""}
單字請用原形（動詞原形、名詞單數）。中文意思請依照這篇文章裡的用法，用繁體中文。
只回覆一個 JSON 陣列，不要其他文字。格式範例：
[{"word":"concentrate","pos":"v.","zh":"專心；集中","example":"a well-rested brain can concentrate for longer"}]
example 請放文章中出現這個字的片語或短句。

文章：
${X.text.slice(0,6000)}`;
  try{
    const r=await S.sample.json(prompt, {modelTier:"quick", signal:X.ctl.signal});
    if(Array.isArray(r)){
      X.ai=r.filter(o=>o && typeof o.word==="string" && o.word.trim()).slice(0,20).map(o=>({front:String(o.word).trim().toLowerCase(), pos:String(o.pos||""), back:String(o.zh||""), example:String(o.example||"")}));
      if(autoVocabOn()){ const subj=($("#rdSubj")||{}).value || READ_SUBJ, ch=(($("#rdChap")||{}).value||"").trim(), sec=(($("#rdSec")||{}).value||"").trim(), ids=addVocab(X.ai, subj, ch, sec); if(ids.length) vocabToast(ids, subj, ch, sec); else toast(`Claude 找到 ${X.ai.length} 個重點單字，都已經在單字庫了`); }
      else toast(`Claude 找到 ${X.ai.length} 個重點單字`);
    } else toast("Claude 回覆的格式不對，再按一次試試");
  }catch(e){
    const c=e && e.code;
    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){ S.sample=null; toast("這裡沒辦法使用 Claude，先用內建單字庫標記"); }
    else if(c==="rate_limited") toast("用得有點頻繁，等一下再試");
    else if(c!=="cancelled") toast("分析失敗，可以再按一次試試");
  }finally{ X.busy=false; X.ctl=null; render(true); }
}
async function explainWord(){
  const sh=S.sheet; if(!S.sample || !sh || sh.busy) return;
  sh.busy=true; renderSheet();
  const ctx=sentenceFor(sh.raw);
  try{
    const r=await S.sample.json(`用繁體中文為台灣的大學生解釋英文單字「${sh.w}」${ctx?`在這句話裡的意思：「${ctx}」`:""}。只回覆 JSON：{"word":"原形","pos":"n./v./adj./adv.","zh":"簡短中文意思","example":"一個簡單英文例句"}`, {modelTier:"quick"});
    if(r && r.zh && S.sheet===sh){ sh.info={front:sh.w, pos:String(r.pos||""), back:String(r.zh), example:ctx||String(r.example||"")}; }
  }catch(e){
    const c=e && e.code;
    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)) S.sample=null;
    toast(c==="rate_limited"?"用得有點頻繁，等一下再試":"查詢失敗，可以自己填中文意思");
  }finally{ sh.busy=false; if(S.sheet===sh) render(true); }
}
